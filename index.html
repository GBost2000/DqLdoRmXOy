<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter Code</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; }
  input { width: min(320px, 100%); padding: 14px 16px; font-size: 18px; text-align: center;
    color: #fff; background: #000; border: 1px solid #555; border-radius: 6px; outline: none; }
  input:focus { border-color: #fff; }
  input::placeholder { color: #888; }
  button { width: min(320px, 100%); padding: 12px 16px; font-size: 16px; cursor: pointer;
    color: #000; background: #fff; border: 0; border-radius: 6px; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 20px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<main>
  <input id="code" type="text" placeholder="Enter Code" autocomplete="off" autofocus>
  <button id="confirm">Confirm</button>
  <div id="msg" role="status"></div>
</main>
<script>
  // 1. Create a free form at https://formspree.io (it emails submissions to you)
  // 2. Paste your form's endpoint URL below
  const ENDPOINT = "https://formspree.io/f/xoedanda";

  const input = document.getElementById("code");
  const btn = document.getElementById("confirm");
  const msg = document.getElementById("msg");

  async function submit() {
    const value = input.value.trim();
    if (!value) return;
    btn.disabled = true;
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ code: value })
      });
      if (!res.ok) throw new Error("failed");
      input.value = "";
      msg.textContent = "Submitted.";
    } catch (e) {
      msg.textContent = "Could not submit. Please try again.";
    }
    btn.disabled = false;
  }

  btn.addEventListener("click", submit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
